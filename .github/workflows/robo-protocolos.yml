# Robô de protocolos: lê só os protocolos em que alguém clicou em "Consultar"
# no app e grava se houve ou não movimentação. Roda a cada 30 min, de segunda
# a sexta, das 8h às 20h (Brasília). Também dá para rodar na hora em
# Actions → Robô de protocolos → Run workflow.
# Agendamento só vale no ramo principal (main): o robô começa a rodar sozinho
# depois que esta versão for publicada no oficial.
# Chave: secret FIREBASE_ROBO_PROTOCOLOS (se existir) ou a mesma da publicação;
# a conta precisa do papel "Cloud Datastore User" no projeto teste-incorp.
name: Robô de protocolos
on:
  schedule:
    - cron: '*/30 11-23 * * 1-5'
  workflow_dispatch:
concurrency:
  group: robo-protocolos
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: robo
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_ROBO_PROTOCOLOS || secrets.FIREBASE_SERVICE_ACCOUNT_TESTE_INCORP }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: robo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Ver se há protocolos para ler
        id: ver
        run: node protocolos.js --verificar
      - name: Instalar navegador
        if: steps.ver.outputs.pendentes != '0'
        run: npx playwright install --with-deps chromium
      - name: Ler os protocolos
        if: steps.ver.outputs.pendentes != '0'
        run: node protocolos.js
