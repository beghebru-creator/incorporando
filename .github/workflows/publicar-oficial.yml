# Publica o app OFICIAL do Incorporando a cada envio para o ramo "main".
# Troca apenas o código (hosting). Banco Firestore e regras NÃO são tocados.
name: Publicar OFICIAL
on:
  push:
    branches: [main]
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar chave
        id: chave
        env:
          RAW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESTE_INCORP }}
        run: |
          python3 - <<'PY'
          import os, json, sys
          raw = os.environ.get("RAW", "")
          dec = json.JSONDecoder()
          data = None
          for txt in (raw, raw.replace("\r", "").replace("\n", "")):
              for k, ch in enumerate(txt):
                  if ch != "{":
                      continue
                  try:
                      obj, _ = dec.raw_decode(txt[k:])
                  except Exception:
                      continue
                  if isinstance(obj, dict) and obj.get("type") == "service_account":
                      data = obj
                      break
              if data:
                  break
          if not data:
              sys.exit("Nao achei uma chave valida no texto guardado no GitHub (tamanho %d caracteres). Cole de novo so o conteudo do chave.json." % len(raw))
          s = json.dumps(data, separators=(",", ":"))
          print("::add-mask::" + s)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("json=" + s + "\n")
          print("Chave OK:", data.get("client_email"))
          PY
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.chave.outputs.json }}
          projectId: teste-incorp
          channelId: live
